name: .NET

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish ResPlan.NET after its Pickle.Net dependency has been released
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - name: Restore
        run: dotnet restore ResPlan.slnx
      - name: Build
        run: dotnet build ResPlan.slnx --no-restore --configuration Release --warnaserror
      - name: Test native runtime on .NET 9 and .NET 10
        run: dotnet test ResPlan.Tests/ResPlan.Tests.csproj --no-build --configuration Release --logger trx
      - name: Compare native sample with committed Python oracle
        run: dotnet run --project tools/ResPlan.Validation -c Release -- ResPlan.Tests/sample.pkl tools/fixtures/sample.expected.jsonl
      - name: Pack Pickle.Net dependency
        run: dotnet pack extern/Pickle.Net/src/Pickle.Net/Pickle.Net.csproj --no-build --configuration Release --output nupkgs
      - name: Pack ResPlan.NET
        run: dotnet pack ResPlan.Library/ResPlan.Library.csproj --no-build --configuration Release --output nupkgs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.os }}
          path: |
            ResPlan.Tests/TestResults/*.trx
            ResPlan.Tests/bin/Release/*/actual_plan_*.png
            nupkgs/*.nupkg

  publish:
    # Publish explicitly from main after both platforms pass. Pickle.Net is released
    # from its own repository; this repository's GITHUB_TOKEN cannot publish for it.
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: results-ubuntu-latest
          path: artifacts
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Verify released dependency and publish ResPlan.NET
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --name github --username "${{ github.actor }}" --password "$NUGET_AUTH_TOKEN" --store-password-in-clear-text
          dotnet new classlib --framework net10.0 --output dependency-check
          dotnet add dependency-check package Pickle.Net --version 0.1.0 --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          dotnet nuget push 'artifacts/nupkgs/ResPlan.NET.*.nupkg' --source github --api-key "$NUGET_AUTH_TOKEN" --skip-duplicate
